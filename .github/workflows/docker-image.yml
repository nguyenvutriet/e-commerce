name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Build Jar
      run: ./mvnw clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecom-web:latest

    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/ecom-web:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          doccker stop ecom || true
          delete rm ecom || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/ecom-web:latest
          docker run -d --name ecom -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/ecom-web:latest
